<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><title>資金頁 N 年後的歷史回測</title></head>
<body>
<h1>資金頁「N 年後」的歷史回測（site/js/backtest.js）</h1>
<p>docs/FUNDS_BACKTEST.md 的驗收：月報酬只取月底且不含未結束的月份；每月報酬都相同時，模擬結果等於現有的 fv 公式；
滾動區間的個數、最差與最好的起點；區塊抽樣會接回開頭、長度正確；固定種子兩次結果相同；百分位的內插；低於本金的比例；樣本太少的標示。</p>
<script type="module">
import { test, eq, near, ok, report } from "./harness.js";
import {
  mulberry32, monthEnds, monthlyReturns, simulate, percentile, percentiles, rollingWindows, blockPath, blockSample,
  describeBacktest, SAMPLE_SEED, SAMPLE_PATHS, BLOCK_MONTHS, MIN_ROLLING,
  pathGrowth, requiredMonthly, hitProbability, monthsToTarget, rollingRequired, MAX_MONTHS,
  lifecycleSpan, lifecycleSpend, lifecycleRun, principalLine,
} from "/site/js/backtest.js";
import { fv, needAt, monthsToNeed, splitNote, futureChart, LIFE_CHART_HEADROOM, lifeChartMax, wan } from "/site/js/pages/funds.js";

const day = (date, value) => ({ date, value });
// 每月都換算成同一個月報酬 m 的假報酬序列（ym 從 2000-01 起）
const ymOf = (i) => `${2000 + Math.floor(i / 12)}-${String((i % 12) + 1).padStart(2, "0")}`;
const flat = (m, n) => Array.from({ length: n }, (_, i) => ({ ym: ymOf(i), r: m }));
const mRate = (r) => Math.pow(1 + r, 1 / 12) - 1;

// ── 月底與月報酬 ──
const S1 = [day("2026-01-02", 100), day("2026-01-30", 101), day("2026-02-02", 102), day("2026-02-27", 110),
  day("2026-03-02", 111), day("2026-03-31", 99), day("2026-04-01", 100), day("2026-04-15", 130)];
test("月底：每個月只取最後一個交易日，最後一天所在的月份（還沒結束）不用", () => {
  eq(monthEnds(S1).map((e) => [e.ym, e.date, e.value]), [["2026-01", "2026-01-30", 101], ["2026-02", "2026-02-27", 110], ["2026-03", "2026-03-31", 99]]);
});
test("最後一天剛好是月底，那個月也不用（照規格：最後一天所在的月份不用）", () => {
  eq(monthEnds([day("2026-01-30", 100), day("2026-02-27", 110), day("2026-03-31", 120)]).map((e) => e.ym), ["2026-01", "2026-02"]);
});
test("月報酬：相鄰月底相除減 1；ym 是後一個月；第一筆是第二個月底相對第一個月底", () => {
  const r = monthlyReturns(S1);
  eq(r.map((x) => x.ym), ["2026-02", "2026-03"]);
  near(r[0].r, 110 / 101 - 1, 1e-12);
  near(r[1].r, 99 / 110 - 1, 1e-12);
});
test("月底不到兩個：月報酬是空的", () => {
  eq(monthlyReturns([day("2026-01-05", 1), day("2026-01-20", 2)]), []);
  eq(monthlyReturns([day("2026-01-30", 1), day("2026-02-10", 2)]), []);
  eq(monthlyReturns([]), []);
});

// ── 模擬 ──
test("每月報酬都相同：模擬結果等於現有 fv 公式（20 年、年 7%、起始 26,754、每月 3,000）", () => {
  const m = mRate(0.07);
  const v = simulate(26754, 3000, flat(m, 240));
  eq(v.length, 240);
  near(v[239] / fv(26754, 3000, 0.07, 240), 1, 1e-9);
  near(v[119] / fv(26754, 3000, 0.07, 120), 1, 1e-9, "第 10 年底");
});
test("報酬 0：只是本金加每月投入；每月月底投入", () => {
  eq(simulate(1000, 100, flat(0, 3)), [1100, 1200, 1300]);
  near(simulate(1000, 100, flat(0.1, 1))[0], 1000 * 1.1 + 100, 1e-9);
});
test("simulate 也接受純數字的報酬", () => eq(simulate(100, 0, [0.1, -0.1]).map((x) => Math.round(x * 100) / 100), [110, 99]));

// ── 百分位 ──
test("百分位：[1,2,3,4] 第 50 是 2.5、第 10 是 1.3、第 0 是 1、第 100 是 4", () => {
  near(percentile([1, 2, 3, 4], 0.5), 2.5, 1e-12);
  near(percentile([1, 2, 3, 4], 0.1), 1.3, 1e-12);
  near(percentile([1, 2, 3, 4], 0.9), 3.7, 1e-12);
  eq([percentile([1, 2, 3, 4], 0), percentile([1, 2, 3, 4], 1)], [1, 4]);
});
test("百分位：先由小到大排序，不改動傳進來的陣列", () => {
  const a = [30, 10, 20];
  eq(percentile(a, 0.5), 20);
  eq(a, [30, 10, 20]);
  eq(percentiles([5, 1, 3, 2, 4], [0.1, 0.5, 0.9]).map((x) => Math.round(x * 100) / 100), [1.4, 3, 4.6]);
});
test("百分位：只有一個值回傳那個值；沒有資料是 null", () => {
  eq(percentile([7], 0.9), 7);
  eq(percentile([], 0.5), null);
});

// ── 滾動區間 ──
test("滾動區間：個數、最差與最好各從哪個年月開始、中位數", () => {
  // 10 個月報酬、湊 3 個月 → 8 個起點。第 3 個月（索引 3）跌 50%、第 7 個月（索引 7）漲 100%
  const rs = flat(0, 10);
  rs[3].r = -0.5;
  rs[7].r = 1;
  const w = rollingWindows(rs, 3, 100, 0);
  // 起點 0..7 的期末：100、50、50、50、100、200、200、200
  eq(w.count, 8);
  eq(w.worst, { value: 50, start: rs[1].ym });
  eq(w.best, { value: 200, start: rs[5].ym });
  eq(w.median, 100);
  eq(w.small, true);
});
test("滾動區間：每個起點都含每月投入，期末值＝模擬最後一個月底", () => {
  const w = rollingWindows(flat(0.01, 14), 12, 1000, 100);
  eq(w.count, 3);
  near(w.worst.value, simulate(1000, 100, flat(0.01, 12)).at(-1), 1e-9);
  eq(w.worst.start, "2000-01"); // 全部一樣大時取第一個
});
test("滾動區間：跟真實資料同樣的長度（285 個月報酬）→ 20 年 46 個起點、10 年 166 個起點", () => {
  const rs = flat(0.01, 285);
  eq([rollingWindows(rs, 240, 0, 1).count, rollingWindows(rs, 120, 0, 1).count], [46, 166]);
});
test("樣本太少的標示：不到 24 個起點標 small，剛好 24 個不標", () => {
  eq(MIN_ROLLING, 24);
  const a = rollingWindows(flat(0.01, 240 + 22), 240, 0, 1), b = rollingWindows(flat(0.01, 240 + 23), 240, 0, 1);
  eq([a.count, a.small], [23, true], "23 個起點要標");
  eq([b.count, b.small], [24, false], "24 個起點不標");
  eq(rollingWindows(flat(0.01, 285), 240, 0, 1).small, false, "46 個不標");
  eq(rollingWindows(flat(0.01, 285), 270, 0, 1).small, true, "16 個標");
});
test("歷史不夠長（月報酬比要湊的月數少）：個數 0，沒有最差與最好", () => {
  const w = rollingWindows(flat(0.01, 285), 300, 100, 10);
  eq([w.count, w.small, w.worst, w.median, w.best], [0, true, null, null, null]);
});

// ── 區塊抽樣 ──
test("固定種子的亂數：mulberry32 跟 Python 另外實作的結果一致，兩次相同", () => {
  const g = mulberry32(1), h = mulberry32(1);
  eq([g(), g(), g()], [0.6270739405881613, 0.002735721180215478, 0.5274470399599522]);
  eq([h(), h(), h()], [0.6270739405881613, 0.002735721180215478, 0.5274470399599522]);
  const k = mulberry32(SAMPLE_SEED);
  eq([k(), k(), k()], [0.7961874215397984, 0.2869089210871607, 0.6110482160001993]);
});
test("固定種子：種子寫成具名常數、預設 2,000 條、區塊 12 個月", () => eq([SAMPLE_SEED, SAMPLE_PATHS, BLOCK_MONTHS], [20261113, 2000, 12]));
test("區塊接回開頭：從最後一個月起取 3 個月，接回第 1、2 個月", () => {
  const rs = [1, 2, 3, 4, 5];
  eq(blockPath(rs, 7, () => 0.99, 3), [5, 1, 2, 5, 1, 2, 5]);
});
test("區塊路徑長度剛好是 months（最後一個區塊截斷）；每個區塊連續取", () => {
  const rs = Array.from({ length: 10 }, (_, i) => i);
  const seq = [0, 0.6, 0];
  let i = 0;
  const p = blockPath(rs, 5, () => seq[i++], 2);
  eq(p, [0, 1, 6, 7, 0]);
  eq(blockPath(rs, 30, mulberry32(3), 12).length, 30);
  eq(blockPath(rs, 24, mulberry32(3), 12).length, 24);
});
test("區塊路徑也接受 { ym, r } 的月報酬", () => eq(blockPath([{ ym: "a", r: 0.1 }, { ym: "b", r: 0.2 }], 3, () => 0.99, 2), [0.2, 0.1, 0.2]));
test("固定種子：同樣的輸入兩次算出來完全一樣；換種子結果不同", () => {
  const rs = flat(0.01, 60).map((x, i) => ({ ...x, r: Math.sin(i) / 10 }));
  const a = blockSample(rs, 120, 1000, 100), b = blockSample(rs, 120, 1000, 100);
  eq(a, b);
  ok(JSON.stringify(blockSample(rs, 120, 1000, 100, { seed: SAMPLE_SEED + 1 })) !== JSON.stringify(a), "換種子應該不同");
});
test("抽樣：每月報酬都相同時，三個百分位都等於 fv，逐年的值也一樣、低於本金的比例是 0", () => {
  const m = mRate(0.07);
  const s = blockSample(flat(m, 50), 240, 26754, 3000);
  const want = fv(26754, 3000, 0.07, 240);
  near(s.final.p10 / want, 1, 1e-9);
  near(s.final.p50 / want, 1, 1e-9);
  near(s.final.p90 / want, 1, 1e-9);
  eq(s.yearly.length, 20);
  near(s.yearly[9].p50 / fv(26754, 3000, 0.07, 120), 1, 1e-9, "第 10 年");
  near(s.yearly[19].p90 / want, 1, 1e-9);
  eq([s.principal, s.below, s.paths], [26754 + 3000 * 240, 0, 2000]);
});
test("低於本金的比例：全部虧損是 1、全部賺錢是 0", () => {
  eq(blockSample(flat(-0.1, 30), 24, 1000, 10).below, 1);
  eq(blockSample(flat(0.1, 30), 24, 1000, 10).below, 0);
  // 期末剛好等於本金（報酬 0）不算低於
  eq(blockSample(flat(0, 30), 24, 1000, 10).below, 0);
});
test("抽樣跟逐條另外重算一致：百分位、逐年、低於本金的比例", () => {
  const rs = Array.from({ length: 80 }, (_, i) => ({ ym: ymOf(i), r: Math.sin(i * 1.7) / 8 }));
  const months = 30, pv = 5000, pmt = 200, paths = 300;
  const s = blockSample(rs, months, pv, pmt, { paths, seed: 7 });
  const rng = mulberry32(7);
  const finals = [], y1 = [];
  for (let k = 0; k < paths; k++) {
    const sim = simulate(pv, pmt, blockPath(rs, months, rng));
    finals.push(sim.at(-1));
    y1.push(sim[11]);
  }
  near(s.final.p10, percentile(finals, 0.1), 1e-9);
  near(s.final.p50, percentile(finals, 0.5), 1e-9);
  near(s.final.p90, percentile(finals, 0.9), 1e-9);
  near(s.yearly[0].p50, percentile(y1, 0.5), 1e-9);
  eq(s.yearly.length, 2);
  eq(s.below, finals.filter((v) => v < pv + pmt * months).length / paths);
  ok(s.final.p10 <= s.final.p50 && s.final.p50 <= s.final.p90, "p10 ≤ p50 ≤ p90");
});
test("抽樣：沒有月報酬或 months 是 0 時不算，回傳 null", () => {
  eq(blockSample([], 120, 1, 1).final, null);
  eq(blockSample(flat(0.01, 12), 0, 1, 1).below, null);
});

// ── 回測期間的描述 ──
test("回測期間：起訖年月、年化、最大回落（月底資料）", () => {
  const d = describeBacktest([day("2026-01-30", 100), day("2026-02-27", 110), day("2026-03-31", 99), day("2026-04-30", 120), day("2026-05-12", 130)]);
  eq([d.base, d.from, d.to, d.months], ["2026-01", "2026-02", "2026-04", 3]);
  near(d.annualized, Math.pow(1.2, 12 / 3) - 1, 1e-12);
  near(d.maxDrawdown, 99 / 110 - 1, 1e-12);
  eq(d.drawdown, { peak: "2026-02", trough: "2026-03" });
  near(d.years, 0.25, 1e-12);
});
test("回測期間：一路上漲沒有回落（最大回落是 0）；月底不到兩個是 null", () => {
  const d = describeBacktest([day("2026-01-30", 100), day("2026-02-27", 110), day("2026-03-31", 120), day("2026-04-02", 125)]);
  eq([d.maxDrawdown, d.drawdown], [0, null]);
  eq(describeBacktest([day("2026-01-30", 100), day("2026-01-31", 101)]), null);
});

// ── 跟真實資料同樣長度的合成日資料（2003-01 ～ 2026-11-12）──
test("合成日資料（286 個月底、最後一個月只有半個月）：月報酬 285 個、20 年 46 個起點、10 年 166 個起點", () => {
  const series = [];
  let v = 4500;
  for (let i = 0; i < 24 * 12 - 2; i++) {
    const ym = `${2003 + Math.floor(i / 12)}-${String((i % 12) + 1).padStart(2, "0")}`;
    series.push(day(`${ym}-02`, v), day(`${ym}-28`, (v *= 1.01)));
  }
  series.push(day("2026-11-12", v * 1.02));
  const rs = monthlyReturns(series);
  eq(rs.length, 285);
  eq([rs[0].ym, rs.at(-1).ym], ["2003-02", "2026-10"]);
  eq([rollingWindows(rs, 240, 1000, 100).count, rollingWindows(rs, 120, 1000, 100).count], [46, 166]);
  near(rs[0].r, 0.01, 1e-9);
});

// ── 財富自由試算（第二部分）──
// 路徑的 G（累積成長）與 A（每月投 1 元累積到期末）：期末值＝pv × G ＋ pmt × A
const wiggle = (n, k = 1.7, d = 8) => Array.from({ length: n }, (_, i) => ({ ym: ymOf(i), r: Math.sin(i * k) / d }));
test("線性關係：pv × G ＋ pmt × A 等於同一條路徑直接模擬的期末值", () => {
  const rs = wiggle(80), months = 30, pv = 5000, pmt = 200, paths = 40;
  const ga = pathGrowth(rs, months, { paths, seed: 11 });
  const rng = mulberry32(11);
  for (let k = 0; k < paths; k++) {
    const direct = simulate(pv, pmt, blockPath(rs, months, rng)).at(-1);
    near(pv * ga.G[k] + pmt * ga.A[k], direct, 1e-6 * Math.abs(direct), `第 ${k} 條`);
  }
  eq([ga.paths, ga.months, ga.G.length, ga.A.length], [paths, months, paths, paths]);
});
test("每月報酬都相同：G ＝ (1+m)^n、A ＝ ((1+m)^n − 1) ÷ m，pv × G ＋ pmt × A 等於 fv", () => {
  const m = mRate(0.07), n = 240, ga = pathGrowth(flat(m, 50), n, { paths: 5 });
  near(ga.G[0] / Math.pow(1 + m, n), 1, 1e-12);
  near(ga.A[4] / ((Math.pow(1 + m, n) - 1) / m), 1, 1e-12);
  near((26754 * ga.G[2] + 3000 * ga.A[2]) / fv(26754, 3000, 0.07, n), 1, 1e-12);
});
test("跟「N 年後」同一批路徑：用 G、A 算出的期末值百分位等於 blockSample 的", () => {
  const rs = wiggle(120), months = 60, pv = 9000, pmt = 500;
  const ga = pathGrowth(rs, months);
  const finals = Array.from(ga.G, (g, k) => pv * g + pmt * ga.A[k]);
  const s = blockSample(rs, months, pv, pmt);
  near(percentile(finals, 0.1), s.final.p10, 1e-6 * s.final.p10);
  near(percentile(finals, 0.9), s.final.p90, 1e-6 * s.final.p90);
});
test("需要的每月投入：每月報酬都相同時，等於用 fv 反推（原本固定報酬的公式）", () => {
  const r = 0.07, m = mRate(r), n = 240, pv = 26754, target = needAt(100000, 0.04, 0.02, n);
  const g = Math.pow(1 + m, n), want = (target - pv * g) / ((g - 1) / m);
  const q = requiredMonthly(pathGrowth(flat(m, 50), n, { paths: 20 }), pv, target);
  near(q.p10 / want, 1, 1e-9);
  near(q.p50 / want, 1, 1e-9);
  near(q.p90 / want, 1, 1e-9);
  near(fv(pv, q.p50, r, n) / target, 1, 1e-9, "照這個每月投入剛好達標");
});
test("需要的每月投入：目標已經達到就是 0，不會是負的", () => {
  const q = requiredMonthly(pathGrowth(flat(0.01, 30), 24, { paths: 10 }), 1000, 500);
  eq([q.p10, q.p50, q.p90], [0, 0, 0]);
});
test("需要的每月投入：第 10 百分位最少（偏好的情況）、第 90 最多（偏差的情況）", () => {
  const q = requiredMonthly(pathGrowth(wiggle(120), 120), 10000, 2_000_000);
  ok(q.p10 <= q.p50 && q.p50 <= q.p90 && q.p10 < q.p90, `${q.p10} ${q.p50} ${q.p90}`);
});
test("達標機率：每月報酬都相同時只有 0 或 1；目標剛好是中位數時是一半", () => {
  const m = mRate(0.07), n = 120, ga = pathGrowth(flat(m, 50), n, { paths: 10 });
  const end = fv(1000, 100, 0.07, n);
  eq(hitProbability(ga, 1000, 100, end * 0.99), 1);
  eq(hitProbability(ga, 1000, 100, end * 1.01), 0);
  const rs = wiggle(120), g2 = pathGrowth(rs, 60), s = blockSample(rs, 60, 9000, 500);
  eq(hitProbability(g2, 9000, 500, s.final.p50), 0.5, "大於等於中位數的路徑剛好一半");
  eq(hitProbability(g2, 9000, 500, 0), 1);
});
test("達標機率：每月投得越多機率越高", () => {
  const ga = pathGrowth(wiggle(120), 120);
  ok(hitProbability(ga, 10000, 1000, 800_000) <= hitProbability(ga, 10000, 3000, 800_000));
});
test("沒有月報酬或 months 是 0：需要的每月投入與達標機率回傳 null", () => {
  const ga = pathGrowth([], 120);
  eq([ga.paths, requiredMonthly(ga, 1, 1), hitProbability(ga, 1, 1, 1)], [0, null, null]);
});

test("多久存到：每月報酬都相同時，等於現有固定報酬公式 monthsToNeed（無通膨與有通膨）", () => {
  const m = mRate(0.07);
  for (const infl of [0, 0.02]) {
    const want = monthsToNeed(100000, 0.04, infl, 26754, 3000, 0.07);
    ok(want != null && want > 0, `基準 ${want}`);
    const r = monthsToTarget(flat(m, 50), 26754, 3000, (k) => needAt(100000, 0.04, infl, k), { paths: 20 });
    eq([r.p10, r.p50, r.p90, r.unreached], [want, want, want, 0], `通膨 ${infl}`);
  }
});
test("多久存到：有通膨時目標逐月成長，比沒通膨慢", () => {
  const rs = flat(0, 10), tgt = (infl) => (k) => 1000 * Math.pow(1 + infl, k / 12);
  const a = monthsToTarget(rs, 0, 100, tgt(0), { paths: 3 }), b = monthsToTarget(rs, 0, 100, tgt(0.1), { paths: 3 });
  eq(a.p50, 10);
  let want = 0;
  while (100 * want < tgt(0.1)(want)) want++;
  eq(b.p50, want);
  ok(want > 10);
});
test("多久存到：已經達標回 0；上限 1,200 個月（含），到不了記成 Infinity", () => {
  eq(MAX_MONTHS, 1200);
  eq(monthsToTarget(flat(0, 10), 500, 0, () => 500, { paths: 3 }).p50, 0);
  eq(monthsToTarget(flat(0, 10), 0, 1, () => 1200, { paths: 3 }).p50, 1200);
  const never = monthsToTarget(flat(0, 10), 0, 1, () => 1201, { paths: 3 });
  eq([never.p10, never.p50, never.p90, never.unreached], [Infinity, Infinity, Infinity, 1]);
  eq(monthsToTarget(flat(0, 10), 0, 1, () => 30, { paths: 3, max: 24 }).p50, Infinity, "max 可調");
});
test("多久存到：區塊不夠就繼續抽（只有 3 個月的報酬也能往下跑）", () => {
  const r = monthsToTarget(flat(0.005, 3), 100, 10, (k) => 200 + 15 * k, { paths: 20 });
  ok(Number.isFinite(r.p50) && r.p50 > 12, `${r.p50}`);
});
test("多久存到：偏好的情況（第 10）比偏差的情況（第 90）快；到不了的路徑排在最後", () => {
  const r = monthsToTarget(wiggle(120, 1.3, 6), 1000, 100, () => 60000, { paths: 300, seed: 5 });
  ok(r.p10 <= r.p50 && r.p50 <= r.p90, `${r.p10} ${r.p50} ${r.p90}`);
  const hard = monthsToTarget(flat(0, 5), 0, 1, () => 5000, { paths: 10, max: 100 });
  eq([hard.p10, hard.p90, hard.unreached], [Infinity, Infinity, 1]);
});
test("百分位遇到 Infinity：內插到它就算到不了，不會變 NaN", () => {
  eq(percentile([1, 2, Infinity], 0.5), 2);

  eq(percentile([1, 2, 3, Infinity], 0.9), Infinity);
  eq(percentile([Infinity], 0.5), Infinity);
  near(percentile([1, 2, 3, 4], 0.1), 1.3, 1e-12);

test("固定種子可重現；每一項計算各自從種子開始（先跑別的計算不影響結果）", () => {
  const rs = wiggle(100), tgt = (k) => 50000 * Math.pow(1.02, k / 12);
  const a = monthsToTarget(rs, 1000, 200, tgt);
  pathGrowth(rs, 120);
  blockSample(rs, 60, 1, 1);
  eq(monthsToTarget(rs, 1000, 200, tgt), a);
  const ga = pathGrowth(rs, 120);
  eq(requiredMonthly(ga, 1000, 1e6), requiredMonthly(pathGrowth(rs, 120), 1000, 1e6));

});
test("滾動區間的需要每月投入：跟逐個起點直接算一致，最好最少、最差最多，含起始年月", () => {
  const rs = wiggle(60, 0.9, 5), months = 24, pv = 5000, target = 200000;
  const w = rollingRequired(rs, months, pv, target);
  const all = [];
  for (let i = 0; i + months <= rs.length; i++) {
    const win = rs.slice(i, i + months);
    const g = simulate(1, 0, win).at(-1), a = simulate(0, 1, win).at(-1);
    all.push({ v: Math.max(0, (target - pv * g) / a), start: rs[i].ym });
  }
  eq(w.count, all.length);
  const lo = all.reduce((x, y) => (y.v < x.v ? y : x)), hi = all.reduce((x, y) => (y.v > x.v ? y : x));
  near(w.best.value, lo.v, 1e-6 * lo.v);
  near(w.worst.value, hi.v, 1e-6 * hi.v);
  eq([w.best.start, w.worst.start], [lo.start, hi.start]);
  near(w.median, percentile(all.map((x) => x.v), 0.5), 1e-6);
  ok(w.best.value <= w.median && w.median <= w.worst.value);
});
test("滾動區間的需要每月投入：起點個數與樣本太少的標示跟「N 年後」一樣（46、166；不到 24 標 small；湊不出是 0）", () => {
  const rs = flat(0.01, 285);
  eq([rollingRequired(rs, 240, 0, 1e6).count, rollingRequired(rs, 120, 0, 1e6).count], [46, 166]);
  eq([rollingRequired(rs, 240, 0, 1e6).small, rollingRequired(rs, 270, 0, 1e6).small], [false, true]);
  const none = rollingRequired(rs, 300, 0, 1e6);
  eq([none.count, none.small, none.best, none.median, none.worst], [0, true, null, null, null]);
});

// ── 生命週期試算（第三部分）──
const LC = { pv: 27047, pmt: 3000, infl: 0.02, S: 120, D: 120 };
test("年齡換月數：30／65／85 是 420＋240＝660 個月；退休 ≤ 現在或壽命 ≤ 退休不算", () => {
  eq(lifecycleSpan(30, 65, 85), { S: 420, D: 240, N: 660 });
  eq([lifecycleSpan(65, 65, 85), lifecycleSpan(70, 60, 90), lifecycleSpan(30, 65, 65), lifecycleSpan(30, 65, 60), lifecycleSpan(NaN, 65, 85)], [null, null, null, null, null]);
});
test("每月報酬都相同、通膨 0：退休時資產等於 fv；W* 等於 退休時資產 × r ÷ (1 − (1 + r)^−D)；三個百分位相同", () => {
  const r = 0.007, rs = flat(r, 60), R = Math.pow(1 + r, 12) - 1;
  const p = { pv: 50000, pmt: 4000, infl: 0, S: 180, D: 300 };
  const sp = lifecycleSpend(rs, p, { paths: 30 });
  const retire = fv(p.pv, p.pmt, R, p.S);
  const w = (retire * r) / (1 - Math.pow(1 + r, -p.D));
  for (const k of ["p10", "p50", "p90"]) {
    near(sp.retire[k], retire, 1e-8 * retire, `退休時資產 ${k}`);
    near(sp.retireNominal[k], retire, 1e-8 * retire, `名目 ${k}`);
    near(sp.spend[k], w, 1e-8 * w, `W* ${k}`);
  }
  eq(sp.paths, 30);
  eq([sp.W.length, sp.retireAssets.length], [30, 30]);
});
test("有通膨、報酬固定：照 W* 的 0.99 倍跑，撐到的機率 100%；1.01 倍是 0%（用完月份在最後幾個月）", () => {
  const rs = flat(0.005, 40), p = { pv: 20000, pmt: 3000, infl: 0.03, S: 240, D: 240 };
  const w = lifecycleSpend(rs, p, { paths: 20 }).spend.p50;
  const ok99 = lifecycleRun(rs, { ...p, W: w * 0.99 }, { paths: 20 }), bad = lifecycleRun(rs, { ...p, W: w * 1.01 }, { paths: 20 });
  eq([ok99.survive, bad.survive], [1, 0]);
  eq([ok99.depleted.p10, ok99.depleted.p50], [null, null]);
  ok(bad.depleted.p50 > p.S && bad.depleted.p50 <= p.S + p.D, `用完月份 ${bad.depleted.p50}`);
  ok(bad.depleted.p50 > p.S + p.D - 24, "1% 的差距只會提早用完最後一兩年");
});
test("W* 剛好花到壽命用完：第 N 個月的資產是 0（直接逐月算）", () => {
  const rs = wiggle(120, 1.7, 30), p = { ...LC, S: 100, D: 140 };
  const sp = lifecycleSpend(rs, p, { paths: 5, seed: 7 });
  const rng = mulberry32(7), m = Math.pow(1 + p.infl, 1 / 12) - 1;
  for (let k = 0; k < 5; k++) {
    const path = blockPath(rs, p.S + p.D, rng);
    let v = p.pv;
    path.forEach((r, i) => { const t = i + 1; v = v * (1 + r) + (t <= p.S ? p.pmt : -sp.W[k] * Math.pow(1 + m, t)); });
    near(v, 0, 1e-6 * p.pv, `第 ${k} 條`);
  }
});
test("同一組路徑：lifecycleRun 撐到的比例等於 W* ≥ W 的路徑比例；第 S÷12 年的百分位等於 lifecycleSpend 的退休時資產", () => {
  const rs = wiggle(120, 1.7, 30), p = { ...LC, S: 120, D: 180 };
  const sp = lifecycleSpend(rs, p);
  for (const w of [sp.spend.p10 * 0.97, sp.spend.p50 * 1.03, sp.spend.p90 * 1.02]) {
    const run = lifecycleRun(rs, { ...p, W: w });
    eq(run.paths, sp.paths);
    eq(run.survive, [...sp.W].filter((x) => x >= w).length / sp.paths, `W=${Math.round(w)}`);
  }
  const run = lifecycleRun(rs, { ...p, W: sp.spend.p50 });
  for (const k of ["p10", "p50", "p90"]) near(run.yearly[p.S / 12][k], sp.retire[k], 1e-6 * sp.retire[k], k);
  eq(run.yearly.length, (p.S + p.D) / 12 + 1);
  eq(run.yearly[0], { year: 0, p10: p.pv, p50: p.pv, p90: p.pv });
});
test("用完後資產記 0、不會再變正；用完月份的百分位碰到沒用完的路徑是 null", () => {
  const rs = wiggle(120, 1.7, 30), p = { ...LC, S: 120, D: 240 };
  const sp = lifecycleSpend(rs, p);
  const all = lifecycleRun(rs, { ...p, W: sp.spend.p90 * 3 });
  eq(all.survive, 0);
  eq([all.yearly.at(-1).p10, all.yearly.at(-1).p50, all.yearly.at(-1).p90], [0, 0, 0]);
  ok(all.depleteMonths.every((x) => Number.isFinite(x) && x > p.S && x <= p.S + p.D));
  ok(Number.isFinite(all.depleted.p10) && Number.isFinite(all.depleted.p50));
  const mostly = lifecycleRun(rs, { ...p, W: sp.spend.p10 * 0.8 });
  ok(mostly.survive > 0.9, `撐到 ${mostly.survive}`);
  eq(mostly.depleted.p10, null);
  eq(mostly.depleted.p50, null);
  // 其他花費：非 null 的值一定有限，而且跟逐條排序後內插的結果一致
  for (const f of [0.9, 1.1, 1.5]) {
    const run = lifecycleRun(rs, { ...p, W: sp.spend.p50 * f });
    const [a, b] = percentiles(run.depleteMonths, [0.1, 0.5]);
    eq(run.depleted, { p10: Number.isFinite(a) ? a : null, p50: Number.isFinite(b) ? b : null });
  }
});
test("今天的錢換算：通膨 i 時第 y 年的值是名目值除以 (1 + i)^y", () => {
  const r = 0.004, rs = flat(r, 30), i = 0.03, p = { pv: 30000, pmt: 2000, infl: i, S: 60, D: 60 }, W = 9000;
  const m = Math.pow(1 + i, 1 / 12) - 1;
  const run = lifecycleRun(rs, { ...p, W }, { paths: 10 });
  let v = p.pv;
  for (let t = 1; t <= 120; t++) {
    v = v * (1 + r) + (t <= p.S ? p.pmt : -W * Math.pow(1 + m, t));
    if (t % 12 === 0) near(run.yearly[t / 12].p50, Math.max(0, v) / Math.pow(1 + i, t / 12), 1e-6 * Math.abs(v) + 1e-6, `第 ${t / 12} 年`);
    if (v < 0) break;
  }
  const sp = lifecycleSpend(rs, p, { paths: 10 });
  near(sp.retireNominal.p50 / sp.retire.p50, Math.pow(1 + i, p.S / 12), 1e-9);
});
test("生命週期：固定種子可重現；不同種子結果不同；年齡不合理（S 或 D 為 0）時不算", () => {
  const rs = wiggle(120, 1.7, 30), p = { ...LC, W: 40000 };
  eq(lifecycleSpend(rs, p, { paths: 200 }).spend, lifecycleSpend(rs, p, { paths: 200 }).spend);
  eq(lifecycleRun(rs, p, { paths: 200 }).survive, lifecycleRun(rs, p, { paths: 200 }).survive);
  ok(lifecycleSpend(rs, p, { paths: 200, seed: 1 }).spend.p50 !== lifecycleSpend(rs, p, { paths: 200, seed: 2 }).spend.p50);
  const none = lifecycleSpend(rs, { ...p, S: 0 });
  eq([none.paths, none.spend, none.retire], [0, null, null]);
  eq([lifecycleRun(rs, { ...p, D: 0 }).paths, lifecycleRun(rs, { ...p, D: 0 }).survive], [0, null]);
});
