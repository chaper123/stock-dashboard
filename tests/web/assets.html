<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><title>資產頁的計算</title></head>
<body>
<h1>資產頁的計算（site/js/assets.js）</h1>
<p>docs/ASSETS_PAGE.md 第 3 節的驗收：六種期間起點；每日損益（含投入、股利的日子）；累計損益從期間起點歸 0、期間內每日損益加總等於累計損益；比較線換算成期間起點 0%、含股利與不含股利；個股表現的三種報酬；日曆的週合計、週與月報酬率連乘、休市留空、跨月的週。</p>
<script type="module">
import { test, eq, near, ok, report } from "./harness.js";
import { PERIODS, periodLabel, periodStart, dailyPnl, daysFrom, periodPnl, valuesAt, etfIndex, rebase } from "/site/js/assets.js";
import { computePerf } from "/site/js/perf.js";

// ── 期間 ──
test("六種期間：一週、一月、一季、年初至今、一年、全部，預設全部在最後", () => {
  eq(PERIODS.map(([k]) => k), ["1w", "1m", "3m", "ytd", "1y", "all"]);
  eq(PERIODS.map(([, t]) => t), ["一週", "一月", "一季", "年初至今", "一年", "全部"]);
  eq(periodLabel("ytd"), "年初至今");
});
test("期間起點：從最後一個交易日往前推；比第一筆買進早就從第一筆買進開始", () => {
  const first = "2026-04-08", last = "2026-11-16";
  eq(periodStart("1w", first, last), "2026-11-09");
  eq(periodStart("1m", first, last), "2026-10-16");
  eq(periodStart("3m", first, last), "2026-08-16");
  eq(periodStart("ytd", first, last), first);        // 2026-01-01 比第一筆買進早
  eq(periodStart("1y", first, last), first);         // 2025-11-16 比第一筆買進早
  eq(periodStart("all", first, last), first);
  // 資料夠長的時候：年初至今是當年 1/1、一年是去年同一天
  eq(periodStart("ytd", "2020-01-01", last), "2026-01-01");
  eq(periodStart("1y", "2020-01-01", last), "2025-11-16");
  eq(periodStart("3m", "2020-01-01", last), "2026-08-16");
});
test("期間起點：月底不夠的月份取當月最後一天；跨年；閏年", () => {
  eq(periodStart("1m", "2020-01-01", "2026-03-31"), "2026-02-28");
  eq(periodStart("1m", "2020-01-01", "2028-03-31"), "2028-02-29");
  eq(periodStart("3m", "2020-01-01", "2026-05-31"), "2026-02-28");
  eq(periodStart("1m", "2020-01-01", "2026-01-15"), "2025-12-15");
  eq(periodStart("1w", "2020-01-01", "2026-01-03"), "2025-12-27");
  eq(periodStart("1y", "2020-01-01", "2028-02-29"), "2027-02-28");
});

// ── 每日損益、累計損益 ──
// 第 0 天買進 996（成交價到收盤價差 +3），第 2 天再買 500，第 3 天除息 10，第 4 天賣出 200；index 照 perf.js 的口徑逐日連乘
const raw = [["2026-04-08", 999, 996, 0], ["2026-04-09", 1010, 0, 0], ["2026-04-10", 1500, 500, 0], ["2026-04-13", 1490, 0, 10], ["2026-04-14", 1300, -200, 0], ["2026-04-15", 1330, 0, 0]];
let idx = 1, prevV = null;
const days = raw.map(([date, value, flow, div]) => {
  if (prevV != null) idx *= (value - flow + div) / prevV;
  prevV = value;
  return { date, value, flow, div, invested: 0, index: idx, hv: {}, px: {} };
});
const sum = (xs) => xs.reduce((a, x) => a + x, 0);

test("每日損益：市值變化 − 當天投入（賣出算負的）＋ 當天股利；第一天是市值 − 投入", () => {
  const p = dailyPnl(days);
  eq(p.map((x) => x.pnl), [3, 11, -10, 0, 10, 30]);
  eq(p.map((x) => x.date), raw.map((r) => r[0]));
  // 買進的那天（第 2 天）：市值多了 490，其中 500 是自己投入的，所以損益是 −10；除息那天股利算進損益
  eq([p[2].pnl, p[3].pnl], [-10, 0]);
});
test("每日報酬率＝時間加權指數的單日變化（index(d) ÷ index(d−1) − 1），第一天沒有", () => {
  const p = dailyPnl(days);
  eq(p[0].ret, null);
  near(p[1].ret, 1010 / 999 - 1, 1e-12);
  near(p[2].ret, 1000 / 1010 - 1, 1e-12);       // 當天買進的 500 不算報酬
  near(p[3].ret, 1500 / 1500 - 1, 1e-12);       // 股利補回市值的下跌
  near(p[4].ret, 1500 / 1490 - 1, 1e-12);       // 賣出的 200 不算虧損
  near(p[5].ret, 1330 / 1300 - 1, 1e-12);
  near(days.at(-1).index, p.reduce((x, r) => x * (1 + (r.ret ?? 0)), 1), 1e-12);
});
test("累計損益：選全部時從第一天的損益開始累加，最後一天＝最新市值 − 累計投入 ＋ 已領股利", () => {
  const rows = periodPnl(days, "2026-04-08");
  eq(rows.map((r) => r.cum), [3, 14, 4, 4, 14, 44]);
  eq(rows.map((r) => r.pnl), [3, 11, -10, 0, 10, 30]);
  eq(rows[0].ret, null);
  const invested = sum(days.map((d) => d.flow)), divs = sum(days.map((d) => d.div));
  eq(rows.at(-1).cum, days.at(-1).value - invested + divs);
  eq(rows.at(-1).cum, sum(rows.map((r) => r.pnl)));
});
test("累計損益：其他期間的第一天歸 0，期間內每日損益加總＝累計損益＝期間末市值 − 期間初市值 − 之後的投入 ＋ 之後的股利", () => {
  const rows = periodPnl(days, "2026-04-10");
  eq(rows.map((r) => r.date), ["2026-04-10", "2026-04-13", "2026-04-14", "2026-04-15"]);
  eq(rows.map((r) => r.cum), [0, 0, 10, 40]);
  eq(rows.map((r) => r.pnl), [null, 0, 10, 30]);        // 第一天自己的損益（−10）算在期間之前
  eq(rows.at(-1).cum, sum(rows.map((r) => r.pnl ?? 0)));
  const after = days.filter((d) => d.date > "2026-04-10");
  eq(rows.at(-1).cum, 1330 - 1500 - sum(after.map((d) => d.flow)) + sum(after.map((d) => d.div)));
  // 只有一天的期間：累計 0
  const one = periodPnl(days, "2026-04-15");
  eq(one.map((r) => [r.date, r.pnl, r.cum]), [["2026-04-15", null, 0]]);
});
test("期間起點不是交易日：從下一個交易日開始；起點在最後一天之後沒有資料", () => {
  const rows = periodPnl(days, "2026-04-11");          // 週六
  eq(rows[0].date, "2026-04-13");
  eq(rows.map((r) => r.cum), [0, 10, 40]);
  eq(periodPnl(days, "2026-04-16"), []);
  eq(daysFrom(days, "2026-04-13").length, 3);
  eq(daysFrom(days, "2026-04-16"), []);
});
test("期間內沒有投入也沒有股利：累計損益就是市值的變化", () => {
  const flat = ["2026-05-04", "2026-05-05", "2026-05-06"].map((date, i) => ({ date, value: [1000, 1100, 1050][i], flow: 0, div: 0, invested: 1000, index: [1, 1.1, 1.05][i], hv: {}, px: {} }));
  eq(periodPnl(flat, "2026-05-05").map((r) => r.cum), [0, -50]);
});

// ── 比較線 ──
const bar = (time, close) => ({ time, open: close, high: close, low: close, close, volume: 1 });
test("valuesAt：每個日子取不晚於那天的最後一筆，那天之前沒有資料是 null", () => {
  const rows = [{ date: "2026-05-04", value: 10 }, { date: "2026-05-06", value: 12 }];
  eq(valuesAt(rows, ["2026-05-01", "2026-05-04", "2026-05-05", "2026-05-06", "2026-05-07"]), [null, 10, 10, 12, 12]);
  eq(valuesAt([bar("2026-05-04", 7)], ["2026-05-04"], (b) => b.close), [7]);
});
test("rebase：期間起點換算成 0%，起點或某天沒有值就是 null", () => {
  near(rebase([2, 2.2, 1.9])[1], 10, 1e-9);
  near(rebase([2, 2.2, 1.9])[2], -5, 1e-9);
  eq(rebase([2, 2.2, 1.9], 1).map((x) => Math.round(x * 1000) / 1000), [-9.091, 0, -13.636]);
  eq(rebase([null, 2, 3]), [null, null, null]);
  eq(rebase([2, null, 3]), [0, null, 50]);
  eq(rebase(null), []);
});
test("ETF 比較線只用價格（沒有配息資料）：逐日連乘等於收盤價相除", () => {
  const dates = ["2026-05-04", "2026-05-05", "2026-05-06"];
  const idx = etfIndex([bar("2026-05-04", 100), bar("2026-05-05", 102), bar("2026-05-06", 101)], [], dates);
  near(idx[0], 1, 1e-12); near(idx[1], 1.02, 1e-12); near(idx[2], 1.01, 1e-12);
  eq(etfIndex([bar("2026-05-04", 100), bar("2026-05-05", 102), bar("2026-05-06", 101)], null, dates).length, 3);
});
test("ETF 比較線含股利：除息那天股價扣掉股利，指數不憑空損失；不含股利會少算", () => {
  const dates = ["2026-05-04", "2026-05-05", "2026-05-06", "2026-05-07"];
  const bars = [bar("2026-05-04", 100), bar("2026-05-05", 100), bar("2026-05-06", 95), bar("2026-05-07", 96)];
  const withDiv = etfIndex(bars, [{ date: "2026-05-06", cash: 5 }], dates);
  const price = etfIndex(bars, [], dates);
  eq(withDiv.map((x) => Math.round(x * 10000) / 10000), [1, 1, 1, 1.0105]);       // 除息日 (95+5)/100 = 1；之後 96/95
  eq(price.map((x) => Math.round(x * 10000) / 10000), [1, 1, 0.95, 0.96]);
  ok(withDiv.at(-1) > price.at(-1));
});
test("ETF 比較線的除息日：落在兩個日子之間（休市日）算在下一個日子；第一天（含）以前的除息不算", () => {
  const dates = ["2026-05-04", "2026-05-08", "2026-05-11"];       // 5/9、5/10 是週末，不在日子裡
  const bars = [bar("2026-05-04", 100), bar("2026-05-08", 100), bar("2026-05-11", 90)];
  const idx = etfIndex(bars, [{ date: "2026-05-09", cash: 10 }, { date: "2026-05-04", cash: 3 }, { date: "2026-04-20", cash: 3 }], dates);
  eq(idx.map((x) => Math.round(x * 10000) / 10000), [1, 1, 1]);   // 5/9 的 10 元算在 5/11；5/4 以前的不算
});
test("ETF 比較線：缺日沿用前一天收盤；第一天以前沒有日線就回傳 null；配息的 0、負數、壞日期忽略", () => {
  const dates = ["2026-05-04", "2026-05-05", "2026-05-06"];
  const idx = etfIndex([bar("2026-05-04", 100), bar("2026-05-06", 110)], [{ date: "x", cash: 5 }, { date: "2026-05-05", cash: 0 }, { date: "2026-05-05", cash: -1 }], dates);
  eq(idx.map((x) => Math.round(x * 10000) / 10000), [1, 1, 1.1]);
  eq(etfIndex([bar("2026-05-05", 100)], [], dates), null);
  eq(etfIndex([], [], dates), null);
  eq(etfIndex([bar("2026-05-04", 100)], [], []), null);
});
test("ETF 比較線跟 perf.js 對同一檔持股的算法一致（含股利）", () => {
  const dates = ["2026-05-04", "2026-05-05", "2026-05-06", "2026-05-07", "2026-05-08"];
  const closes = [50, 51, 49, 49.5, 50.5];
  const bars = dates.map((d, i) => bar(d, closes[i]));
  const events = [{ ex_date: "2026-05-06", cash: 1.2 }];
  const perf = computePerf({ trades: [{ date: "2026-05-04", market: "tw", code: "X", side: "買進", shares: 1000, price: 50, twd: 50000 }], bars: { X: bars }, fxRows: [], divs: { etfs: { X: { events } } } });
  const mine = etfIndex(bars, events.map((e) => ({ date: e.ex_date, cash: e.cash })), dates);
  eq(perf.days.map((d) => d.date), dates);
  perf.days.forEach((d, i) => near(mine[i], d.index, 1e-12, dates[i]));
  // 換算成期間（5/5 起）0%
  near(rebase(mine, 1).at(-1), (perf.days.at(-1).index / perf.days[1].index - 1) * 100, 1e-9);
});

report();
</script>
</body>
</html>
